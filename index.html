<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 영어 말하기</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--mut:#7a746b;--card:#fff;--ac:#e8590c;--ln:#e8e2d8;--ok:#2f9e44;--bad:#e03131;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a18;--fg:#f0ece4;--mut:#a39d92;--card:#262421;--ln:#38352f;--ac:#ff8a4c}}
:root[data-theme="dark"]{--bg:#1b1a18;--fg:#f0ece4;--mut:#a39d92;--card:#262421;--ln:#38352f;--ac:#ff8a4c}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:16px 16px 84px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px}.row>*{flex:1}
.stat{text-align:center}.stat b{display:block;font-size:26px;color:var(--ac)}.stat span{font-size:12px;color:var(--mut)}
button,.btn{font:inherit;border:0;border-radius:12px;padding:12px;background:var(--ac);color:#fff;font-weight:600;width:100%;text-align:center;display:block;cursor:pointer}
button.sec,.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--ln)}
button.ok{background:var(--ok)}button.bad{background:var(--bad)}button:disabled{opacity:.5}
textarea{width:100%;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--ln);border-radius:12px;padding:10px;min-height:70px;margin-bottom:8px}
.mut{color:var(--mut);font-size:13px}.cue{font-size:24px;font-weight:700;text-align:center;margin:24px 0}
.en{font-size:21px;font-weight:700;text-align:center;margin:12px 0;color:var(--ac)}
.bars{display:flex;gap:6px;align-items:flex-end;height:70px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.bars i{display:block;background:var(--ac);border-radius:4px 4px 0 0;min-height:3px;opacity:.85}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:480px;margin:0 auto;display:flex}
nav a{flex:1;text-align:center;padding:10px 0;font-size:12px;color:var(--mut);cursor:pointer}nav a.on{color:var(--ac);font-weight:700}nav a span{display:block;font-size:20px}
.item{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.item:last-child{border:0}
.item div{flex:1}.x{width:auto;padding:4px 10px;background:transparent;color:var(--mut);border:1px solid var(--ln)}
.dz{display:block;text-align:center;border:2px dashed var(--ac);border-radius:16px;padding:26px 12px;font-size:28px;line-height:1.5;cursor:pointer;font-weight:600}.dz span{font-size:12px;font-weight:400}.dz{position:relative}.dz input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}.dz.over{background:var(--bg)}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--ln);color:var(--mut)}
</style></head><body><div id="app"></div>
<nav><div id="nav"></div></nav>
<script>
const K='enspeak.v1';let S={cards:[],log:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ds(d)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
const INT=[0,1,3,7,14,30,60];
let useAI=false,tab='home',sample=null,canImg=false,maxImg=5,pending=[],draft=[],busy='',P={q:[],i:0,rev:false,heard:'',score:null,err:'',lis:false,done:0};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

const GK='enspeak.key';
// 👇 아래 작은따옴표 안쪽에 AP로 시작되는 API 키를 넣으세요.
let key='';
try{key=localStorage.getItem(GK)||key}catch(e){}

// 모델이 붐비거나(503) 한도에 걸리거나(429) 종료되면(404) 다음 모델로 자동으로 넘어가요.
// 맨 앞이 가장 똑똑한 모델이에요. 나중에 모델이 또 종료되면 이 목록만 바꾸면 돼요.
const MODELS=['gemini-3.8-flash','gemini-3.5-flash','gemini-3.5-flash-lite'];
async function gem(parts){
  let last='';
  for(const m of MODELS){
    for(let i=0;i<2;i++){
      if(i)await new Promise(res=>setTimeout(res,1500+Math.random()*1500)); // 잠깐 쉬었다가 한 번 더
      let r;
      try{
        r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{
          method:'POST',
          headers:{'Content-Type':'application/json','x-goog-api-key':key},
          body:JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:'application/json'}})
        });
      }catch(e){last='네트워크 오류: '+(e&&e.message||e);continue}
      if(r.ok){
        const j=await r.json();
        const t=(j.candidates?.[0]?.content?.parts||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join('');
        try{return JSON.parse(t)}catch(e){last=m+' 응답을 읽지 못했어요';break}
      }
      last=r.status+' ('+m+') '+(await r.text()).slice(0,140);
      if([400,401,403].includes(r.status))throw new Error(last); // 키 문제 등은 모델을 바꿔도 똑같아요
      if(![429,500,503,504].includes(r.status))break; // 404 등은 바로 다음 모델로
    }
  }
  throw new Error(last);
}
async function shrink(f){try{const u=URL.createObjectURL(f);const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u});const k=Math.min(1,1600/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);return {mime:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]}}catch(e){const d=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});return {mime:f.type||'image/jpeg',data:d}}}
function saveKey(){key=document.getElementById('k').value.trim();try{localStorage.setItem(GK,key)}catch(e){}render()}
function clearKey(){key='';try{localStorage.removeItem(GK)}catch(e){}render()}

const due=()=>S.cards.filter(c=>c.due<=today()).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:(b.lapses||0)-(a.lapses||0));
function streak(){let n=0,d=today();if(!S.log[d])d=addDays(d,-1);while(S.log[d]>0){n++;d=addDays(d,-1)}return n}
function mask(en){return en.split(' ').map(w=>w[0]+'_'.repeat(Math.max(0,w.length-1))).join(' ')}
const cue=c=>c.ko||mask(c.en);

function addCards(list){let n=0;const have=new Set(S.cards.map(c=>norm(c.en)));
 for(const x of list){const en=(x.en||'').trim();if(!en||have.has(norm(en)))continue;have.add(norm(en));
  S.cards.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),en,ko:(x.ko||'').trim(),stage:0,due:today(),added:today(),lapses:0,reps:0});n++}
 save();return n}

async function extract(){
 if(!key||!pending.length)return;busy='사진에서 문장을 읽는 중…';render();
 const out=[];try{
  for(let i=0;i<pending.length;i+=5){
   const imgs=await Promise.all(pending.slice(i,i+5).map(shrink));
   const r=await gem([{text:'These images are pages/notes with English sentences the learner studied today. Extract every English sentence or expression (fix obvious typos, skip page numbers, Korean-only text and duplicates). For each, give a natural Korean translation to use as a speaking cue. Return ONLY a JSON array: [{"en":"...","ko":"..."}]'},...imgs.map(d=>({inline_data:{mime_type:d.mime,data:d.data}}))]);
   if(Array.isArray(r))out.push(...r)}
  pending=[];if(!out.length)busy='문장을 찾지 못했어요. 더 선명한 사진으로 다시 시도해 보세요.';else{const had=new Set(S.cards.map(c=>c.id));addCards(out);const ids=S.cards.filter(c=>!had.has(c.id)).map(c=>c.id);busy='';if(ids.length){startWith(ids);return}busy='이미 저장된 문장들이에요.'}
 }catch(e){pending=[];busy='추출 실패: '+(e&&e.message||e)}
 render()}

async function addText(){
 const t=document.getElementById('txt').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!t.length)return;
 const list=t.map(l=>{const m=l.split(/\s*[|\t]\s*/);return {en:m[0],ko:m[1]||''}});
 const need=list.filter(x=>!x.ko).map(x=>x.en);
 if(key&&useAI&&need.length){busy='뜻을 만드는 중…';render();try{const r=await gem([{text:'Give a natural Korean translation for each English sentence, as a speaking cue. Return ONLY a JSON array of {"en","ko"}: '+JSON.stringify(need)}]);if(Array.isArray(r)){const m={};r.forEach(x=>m[norm(x.en||'')]=x.ko);list.forEach(x=>{if(!x.ko)x.ko=m[norm(x.en)]||''})}}catch(e){}}
 const n=addCards(list);busy=n+'개 추가했어요! 홈 위쪽 "말하기 시작"을 눌러 보세요.';render()}

function addDraft(){const n=addCards(draft);draft=[];pending=[];busy=n+'개 추가했어요! 지금 바로 말하기를 시작해 보세요.';render()}

function startWith(ids){const rest=due().map(c=>c.id).filter(x=>!ids.includes(x));P={q:[...ids,...rest],i:0,rev:false,heard:'',score:null,err:'',lis:false,done:0};tab='practice';render()}
function handle(f){const a=Array.from(f||[]);if(!a.length){busy='선택된 사진이 없어요.';render();return}if(!key){busy='API 키가 없어요.';render();return}busy=a.length+'장 받았어요. 읽는 중…';pending=a;tab='home';extract()}
function start(){P={q:due().map(c=>c.id),i:0,rev:false,heard:'',score:null,err:'',lis:false,done:0};tab='practice';render()}
const cur=()=>S.cards.find(c=>c.id===P.q[P.i]);
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function listen(){if(!SR)return;const c=cur();const r=new SR();r.lang='en-US';r.interimResults=false;
 r.onresult=e=>{P.heard=e.results[0][0].transcript;const a=norm(c.en).split(' '),b=new Set(norm(P.heard).split(' '));P.score=Math.round(a.filter(w=>b.has(w)).length/a.length*100);P.rev=true;render()};
 r.onerror=()=>{P.micFail=true;P.err='마이크를 쓸 수 없어요. 직접 말한 뒤 정답을 확인하세요.';P.lis=false;render()};
 r.onend=()=>{P.lis=false;render()};P.lis=true;P.err='';render();try{r.start()}catch(e){P.lis=false}}
function check(){const v=document.getElementById('say').value.trim();if(!v){P.err='먼저 말해 보세요.';render();return}const c=cur();const a=norm(c.en).split(' '),b=new Set(norm(v).split(' '));P.heard=v;P.score=Math.round(a.filter(w=>b.has(w)).length/a.length*100);P.err='';P.rev=true;render()}
function rate(q){const c=cur();c.reps=(c.reps||0)+1;
 if(q==='good'){c.stage=Math.min(c.stage+1,6);c.due=addDays(today(),INT[c.stage])}
 else if(q==='hard'){c.stage=Math.max(c.stage,1);c.due=addDays(today(),Math.max(1,Math.round(INT[c.stage]/2)))}
 else{c.stage=1;c.lapses=(c.lapses||0)+1;c.due=addDays(today(),1)}
 S.log[today()]=(S.log[today()]||0)+1;save();P.done++;P.i++;P.rev=false;P.heard='';P.score=null;P.err='';render()}
function del(id){S.cards=S.cards.filter(c=>c.id!==id);save();render()}
function setPending(inp){pending=Array.from(inp.files);render()}
function go(t){tab=t;render()}

function render(){
 const A=document.getElementById('app');
 document.getElementById('nav').innerHTML=[['home','🏠','홈'],['practice','🗣️','말하기'],['list','📚','문장']].map(([k,i,l])=>`<a class="${tab===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</a>`).join('');
 if(tab==='home')A.innerHTML=home();else if(tab==='practice')A.innerHTML=practice();else A.innerHTML=list();
}

function home(){
 const d=due().length,fc=[];for(let i=0;i<7;i++){const day=addDays(today(),i);fc.push(S.cards.filter(c=>i===0?c.due<=day:c.due===day).length)}
 const mx=Math.max(1,...fc);
 const dn=['오늘','내일'];
 return `<h1>🗣️ 오늘의 영어 말하기</h1>
 <div class="card row"><div class="stat"><b>${d}</b><span>복습할 문장</span></div><div class="stat"><b>${S.cards.length}</b><span>전체 문장</span></div><div class="stat"><b>${streak()}</b><span>연속 일수</span></div></div>
 <button ${d?'':'disabled'} onclick="start()" style="margin-bottom:12px">${d?'말하기 시작 ('+d+'개)':'오늘 복습 끝! 🎉'}</button>
 <div class="card"><h2>📷 사진으로 올리기 <span class="mut">(Gemini)</span></h2>
 ${key?`<div class="dz">📷<br><b style="font-size:15px">사진을 여기에 놓거나, 눌러서 선택</b><br><span class="mut">여러 장 OK · 붙여넣기도 가능 · 올리면 자동으로 인식해서 바로 말하기 연습을 시작해요</span><input id="f" type="file" accept="image/*" multiple onchange="handle(this.files);this.value=''"></div><button class="x" style="margin-top:8px" onclick="clearKey()">키 지우기</button><div contenteditable="true" class="dz" style="font-size:14px;padding:14px;margin-top:10px">또는 여기를 길게 눌러 <b>붙여넣기</b><br><span class="mut">갤러리에서 사진을 복사한 뒤 (안 되는 기기도 있어요)</span></div>`:`<div class="mut">Google AI Studio에서 받은 API 키를 한 번만 붙여넣으세요. 이 폰 안에만 저장돼요.</div><input id="k" type="password" placeholder="API 키" style="width:100%;padding:10px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--fg);margin:8px 0"><button onclick="saveKey()">키 저장</button>`}
 ${busy?`<p class="mut">${esc(busy)}</p>`:''}
 ${draft.length?`<div style="margin-top:8px">${draft.map((x,i)=>`<div class="item"><div>${esc(x.en)}<div class="mut">${esc(x.ko||'')}</div></div><button class="x" onclick="draft.splice(${i},1);render()">✕</button></div>`).join('')}<button class="ok" style="margin-top:8px" onclick="addDraft()">${draft.length}개 문장 추가</button></div>`:''}
 <h2 style="margin-top:14px">✍️ 문장 붙여넣기 (무료)</h2><p class="mut" style="margin:0 0 8px">사진 속 글자는 폰 기능으로 복사하세요 (갤러리에서 글자 길게 누르기 / 구글 렌즈 / 삼성 '텍스트 추출'). 한 줄에 한 문장, 뜻은 <b>영어 | 한국어</b>로 쓰면 같이 저장돼요.</p><textarea id="txt" placeholder="I'm running late. | 나 늦을 것 같아"></textarea>${key?`<label class="mut" style="display:block;margin-bottom:8px"><input type="checkbox" ${useAI?'checked':''} onchange="useAI=this.checked"> 뜻 없는 문장은 AI가 번역 (Gemini)</label>`:''}<button class="sec" onclick="addText()">추가</button></div>
 <div class="card"><h2>📅 앞으로 7일 복습 예정</h2><div class="bars">${fc.map((n,i)=>`<div><i style="height:${n/mx*50}px"></i>${n}<br>${i<2?dn[i]:addDays(today(),i).slice(8)+'일'}</div>`).join('')}</div>
 <p class="mut" style="margin:8px 0 0">망각곡선 간격: 당일 → 1일 → 3일 → 7일 → 14일 → 30일 → 60일. 잘 말하면 간격이 늘고, 막히면 다음 날 다시 나와요.</p></div>`}

function practice(){
 if(!P.q.length||P.i>=P.q.length){const d=due().length;return `<h1>🗣️ 말하기</h1><div class="card" style="text-align:center"><div style="font-size:42px">${P.done?'🎉':'🙂'}</div><p>${P.done?P.done+'개 문장을 말했어요! 내일 또 만나요.':(d?'복습할 문장이 있어요.':'지금 복습할 문장이 없어요.')}</p>${d?'<button onclick="start()">시작하기</button>':''}</div>`}
 const c=cur();
 const hd=`<div class="mut" style="text-align:center">${P.i+1} / ${P.q.length} · <span class="pill">단계 ${c.stage}</span></div>`;
 if(!P.rev)return `<h1>🗣️ 영어로 말해 보세요</h1><div class="card">${hd}<div class="cue">${esc(cue(c))}</div>
  ${P.err?`<p class="mut" style="text-align:center">${esc(P.err)}</p>`:''}
  ${SR&&window.isSecureContext&&!P.micFail?`<button onclick="listen()" ${P.lis?'disabled':''}>${P.lis?'듣는 중… 말해 보세요':'🎤 말하기'}</button><div style="height:8px"></div>`:`<textarea id="say" placeholder="키보드의 🎤(음성 입력)을 눌러 영어로 말해 보세요" style="min-height:56px"></textarea><button onclick="check()">말한 내용 확인</button><div style="height:8px"></div>`}
  <button class="sec" onclick="P.rev=true;render()">정답 보기</button></div>`;
 return `<h1>🗣️ 정답 확인</h1><div class="card">${hd}<div class="mut" style="text-align:center;margin-top:10px">${esc(c.ko||'')}</div><div class="en">${esc(c.en)}</div>
  ${P.heard?`<p class="mut" style="text-align:center">내 발음 인식: “${esc(P.heard)}” · 일치 ${P.score}%</p>`:''}
  <button class="sec" onclick="speak(cur().en)">🔊 듣기</button>
  <p class="mut" style="text-align:center">듣고 한 번 더 소리 내어 따라 말한 뒤 평가하세요</p>
  <div class="row"><button class="bad" onclick="rate('fail')">못 말함</button><button class="sec" onclick="rate('hard')">더듬음</button><button class="ok" onclick="rate('good')">바로 말함</button></div></div>`}

function list(){
 const cs=[...S.cards].sort((a,b)=>a.due<b.due?-1:1);
 return `<h1>📚 내 문장 (${cs.length})</h1><div class="card">${cs.length?cs.map(c=>`<div class="item"><div>${esc(c.en)}<div class="mut">${esc(c.ko)}</div><span class="pill">단계 ${c.stage}</span> <span class="pill">다음 ${c.due===today()?'오늘':c.due.slice(5)}</span></div><button class="x" onclick="del('${c.id}')">✕</button></div>`).join(''):'<div class="mut">아직 문장이 없어요. 홈에서 사진을 올려 보세요.</div>'}</div>`}
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();handle(e.dataTransfer&&e.dataTransfer.files)});
document.addEventListener('paste',e=>{if(e.clipboardData&&e.clipboardData.files.length){e.preventDefault();handle(e.clipboardData.files)}});
window.addEventListener('error',e=>{const a=document.getElementById('app');if(a)a.insertAdjacentHTML('afterbegin','<p style="color:#e03131">오류: '+esc(e.message||'')+'</p>')});
render();
</script></body></html>
