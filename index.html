  function reset(){if(flying()||won||pend)return;if(!(p.birds[sel]>0)){const k=TYPES.find(t=>p.birds[t]>0);if(k)sel=k;else{pend=null;refresh();if(alive())toast("새가 없어요! 왼쪽에서 단어를 배워요 📚");return}}pend={t:sel};pos={x:SX,y:SY};refresh()}
  function parts(x,y,c){for(let i=0;i<14;i++)ps.push({x,y,vx:Math.random()*8-4,vy:Math.random()*8-6,l:30,c:c||"#ffca28"})}
  function boom(x,y,R,d){[...blocks,...pigs].forEach(o=>{const cx=o.r?o.x:o.x+o.w/2,cy=o.r?o.y:o.y+o.h/2,k=Math.hypot(cx-x,cy-y);if(k<R)o.hp-=d*(1-k/R*.5)});parts(x,y,"#ff7043")}
  function bubble(x,y,R){[...blocks,...pigs].forEach(o=>{const cx=o.r?o.x:o.x+o.w/2,cy=o.r?o.y:o.y+o.h/2;if(Math.hypot(cx-x,cy-y)<R)o.bub=170});parts(x,y,"#ec6bd6")}
  const circRect=(c,b)=>Math.hypot(c.x-Math.max(b.x,Math.min(c.x,b.x+b.w)),c.y-Math.max(b.y,Math.min(c.y,b.y+b.h)))<c.r;
  function floorY(o){const P=!!o.r,l=P?o.x-o.r:o.x,r=P?o.x+o.r:o.x+o.w,bot=P?o.y+o.r:o.y+o.h;let f=GY;blocks.forEach(b=>{if(b!==o&&b.hp>0&&b.x<r-2&&b.x+b.w>l+2&&b.y>=bot-3&&b.y<f)f=b.y});return f}
  function phys(o){if(o.hp<=0)return;if(o.bub>0){o.bub--;o.y-=1.1;o.vy=0;return}
    const ext=o.r||o.h,fy=floorY(o),bot=o.y+ext,land=()=>{if(o.vy>4)o.hp-=o.vy*4;o.vy=0};
    if(bot<fy-1){o.vy+=.4;if(bot+o.vy>=fy){o.y=fy-ext;land()}else o.y+=o.vy}else{o.y=fy-ext;land()}}
  function skill(f){f.used=true;
    if(f.t=="chuck"){f.vx*=1.9;f.vy*=1.9}
    else if(f.t=="bomb"){f.dead=true;boom(f.x,f.y,90,45)}
    else if(f.t=="blues"){[-.3,.3].forEach(a=>{const c=Math.cos(a),s=Math.sin(a);fl.push({x:f.x,y:f.y,vx:f.vx*c-f.vy*s,vy:f.vx*s+f.vy*c,r:9,t:"blues",pw:.8,used:true,age:f.age,cd:0})})}
    else if(f.t=="matilda"){fl.push({x:f.x,y:f.y+10,vx:0,vy:5,r:8,t:"egg",pw:1,used:true,age:0,cd:0});f.vy=-7}}
  function step(){
    fl.forEach(f=>{if(f.dead)return;f.vy+=f.t=="egg"?.5:.35;f.x+=f.vx;f.y+=f.vy;f.age++;f.cd--;
      const sp=Math.hypot(f.vx,f.vy),hb=blocks.filter(b=>b.hp>0&&circRect(f,b)),hp=pigs.filter(q=>q.hp>0&&Math.hypot(f.x-q.x,f.y-q.y)<f.r+q.r);
      const gnd=f.y>GY-f.r;if(gnd){f.y=GY-f.r;f.vy*=-.3;f.vx*=.75}
      if((hb.length||hp.length||(gnd&&sp>3))&&f.cd<=0){f.cd=8;
        if(f.t!="egg"){hb.forEach(b=>b.hp-=sp*f.pw*4);hp.forEach(q=>q.hp-=sp*f.pw*3)}
        if(f.t=="bomb"&&!f.used){f.dead=true;boom(f.x,f.y,90,45);return}
        if(f.t=="egg"){f.dead=true;boom(f.x,f.y,70,35);return}
        if(f.t=="stella"&&!f.used){f.used=true;bubble(f.x,f.y,105)}
        if(hb.length||hp.length){f.vx*=-.35;f.vy*=.4;f.x+=f.vx*2}}
      if(f.age>500||f.x>860||f.x<-80||(gnd&&Math.abs(f.vx)<.4&&f.age>40)){if(f.t=="bomb"&&!f.used)boom(f.x,f.y,90,45);f.dead=true}});
    blocks.forEach(phys);pigs.forEach(phys);
    blocks.forEach(b=>{if(b.hp<=0&&!b.d){b.d=1;score+=200;parts(b.x+b.w/2,b.y,MAT[b.m].c)}});
    pigs.forEach(q=>{if(q.hp<=0&&!q.d){q.d=1;score+=1000;parts(q.x,q.y,"#7ed957")}});
    blocks=blocks.filter(b=>b.hp>0);ps.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.3;q.l--});ps=ps.filter(q=>q.l>0);
    fl=fl.filter(f=>!f.dead||f.age<0);
    const fn=flying()||fl.length>0;if(wasFly&&!fn&&!won)setTimeout(reset,500);wasFly=fn;
    if(!won&&pigs.length&&!alive())win();
    const s=$("#sc");if(s)s.textContent=score}
  function win(){won=true;const left=TYPES.reduce((a,t)=>a+(p.birds[t]||0),0);score+=left*300;const st=used<=2?3:used<=4?2:1;
    if(lv<=5)p.stars[lv]=Math.max(p.stars[lv]||0,st);const s=STICKERS[Math.random()*STICKERS.length|0];p.stickers.push(s);if(score>p.best)p.best=score;save();hdr();refresh();toast("🎉 클리어! "+(lv<=5?"★".repeat(st)+" ":"")+"스티커 "+s)}
  function bird(x,y,t,r){g.fillStyle=BC[t];g.beginPath();g.arc(x,y,r,0,7);g.fill();g.strokeStyle="#0006";g.lineWidth=2;g.stroke();g.fillStyle="#fff";g.beginPath();g.arc(x+r*.35,y-r*.2,r*.3,0,7);g.fill();g.fillStyle="#000";g.fillRect(x+r*.3,y-r*.3,r*.15,r*.25)}
  function draw(){
    const gr=g.createLinearGradient(0,0,0,GY);gr.addColorStop(0,"#6ec6ff");gr.addColorStop(1,"#d6f1ff");g.fillStyle=gr;g.fillRect(0,0,800,450);
    g.fillStyle="#6bbf59";g.fillRect(0,GY,800,50);g.fillStyle="#7b4a22";g.fillRect(SX-6,SY+10,12,GY-SY-10);g.fillRect(SX-14,SY+2,6,14);
    blocks.forEach(b=>{g.fillStyle=MAT[b.m].c;g.fillRect(b.x,b.y,b.w,b.h);g.strokeStyle=b.m=="glass"?"#4aa3d6":"#5a3a1a";g.lineWidth=2;g.strokeRect(b.x,b.y,b.w,b.h);if(b.hp<MAT[b.m].hp*.5){g.beginPath();g.moveTo(b.x+2,b.y+2);g.lineTo(b.x+b.w-2,b.y+b.h-2);g.stroke()}
      if(b.bub>0){g.strokeStyle="#ec6bd6";g.beginPath();g.arc(b.x+b.w/2,b.y+b.h/2,Math.max(b.w,b.h)/2+6,0,7);g.stroke()}});
    pigs.forEach(q=>{if(q.hp<=0)return;g.fillStyle="#7ed957";g.beginPath();g.arc(q.x,q.y,q.r,0,7);g.fill();g.strokeStyle="#3a7a20";g.stroke();g.fillStyle="#000";g.beginPath();g.arc(q.x-6,q.y-4,3,0,7);g.arc(q.x+6,q.y-4,3,0,7);g.fill();g.fillStyle="#4c9a2a";g.fillRect(q.x-6,q.y+3,12,7);
      if(q.bub>0){g.strokeStyle="#ec6bd6";g.lineWidth=3;g.beginPath();g.arc(q.x,q.y,q.r+7,0,7);g.stroke()}});
    if(pend){if(drag){g.strokeStyle="#4a2a10";g.lineWidth=5;g.beginPath();g.moveTo(SX-8,SY);g.lineTo(pos.x,pos.y);g.lineTo(SX+8,SY);g.stroke();
        let x=pos.x,y=pos.y,vx=(SX-pos.x)*.22,vy=(SY-pos.y)*.22;g.fillStyle="#fff";for(let i=0;i<40;i++){vy+=.35;x+=vx;y+=vy;if(i%3==0&&y<GY){g.beginPath();g.arc(x,y,3,0,7);g.fill()}}}
      bird(pos.x,pos.y,pend.t,14)}
    fl.forEach(f=>{if(f.t=="egg"){g.fillStyle="#fff";g.strokeStyle="#999";g.beginPath();g.ellipse(f.x,f.y,7,9,0,0,7);g.fill();g.stroke()}else bird(f.x,f.y,f.t,f.r)});
    ps.forEach(q=>{g.fillStyle=q.c;g.fillRect(q.x,q.y,5,5)});
    if(!pend&&!flying()&&!won&&alive()&&!TYPES.some(t=>p.birds[t]>0)){g.fillStyle="#333";g.font="24px Jua,sans-serif";g.textAlign="center";g.fillText("왼쪽에서 단어를 배워 새를 모아요! 📚",400,200)}}
  const cp=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*800/r.width,y:(e.clientY-r.top)*450/r.height}};
  cv.onpointerdown=e=>{const c=cp(e),f=fl.find(f=>!f.dead&&!f.used&&f.t!="egg");
    if(f){skill(f);return}
    if(pend&&Math.hypot(c.x-SX,c.y-SY)<70){drag=true;cv.setPointerCapture(e.pointerId)}};
  cv.onpointermove=e=>{if(!drag)return;const c=cp(e);let dx=c.x-SX,dy=c.y-SY,d=Math.hypot(dx,dy);if(d>90){dx*=90/d;dy*=90/d}pos={x:SX+dx,y:SY+dy}};
  cv.onpointerup=()=>{if(!drag)return;drag=false;const dx=SX-pos.x,dy=SY-pos.y;if(Math.hypot(dx,dy)<15){pos={x:SX,y:SY};return}
    const t=pend.t;fl.push({x:pos.x,y:pos.y,vx:dx*.22,vy:dy*.22,r:14,t,pw:t=="red"?1.5:1,used:false,age:0,cd:0});pend=null;p.birds[t]--;spent[t]=(spent[t]||0)+1;used++;save();refresh();wasFly=true};
  function fit(){const w=$("#gw");if(!w)return;const r=w.getBoundingClientRect(),s=Math.min(r.width/800,r.height/450);cv.style.width=800*s+"px";cv.style.height=450*s+"px"}
  function loop(){if(!run||!$("#cv"))return;step();draw();window.RAF=requestAnimationFrame(loop)}
  addEventListener("resize",fit);new ResizeObserver(fit).observe($("#gw"));
  window.G={refresh,reset,stop(){run=false;cancelAnimationFrame(window.RAF)}};
  fit();load(1);loop();
}
profiles();
</script></body></html>
